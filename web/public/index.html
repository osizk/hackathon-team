<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6efe4">
  <title>Agent OS</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="phone" id="phone">
    <header class="statusbar"><span id="clock">9:41</span><span class="status-icons">●●● 5G ▮</span></header>

    <main class="home" id="home" aria-label="Agent home">
      <div class="mascot-wrap" id="mascotWrap">
        <img class="mascot" id="mascot" src="/img/mascot.svg" alt="Agent mascot">
      </div>
      <div class="wave" id="wave" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
      <p class="subtitle" id="subtitle" aria-live="polite"></p>
      <button class="mic" id="mic" aria-label="Hold to talk">
        <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
      </button>
      <p class="mic-hint" id="micHint">กดค้างเพื่อพูด</p>
    </main>

    <section class="stage" id="stage" aria-live="polite"></section>

    <form class="fallback" id="fallback" autocomplete="off" hidden>
      <input id="fallbackInput" name="text" placeholder="Type what the user says, Enter to send" aria-label="Fallback text input">
    </form>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
